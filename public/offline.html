<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Connection — CarpoolHub</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F4EFE2;
            color: #0B1220;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            gap: 16px;
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,.12);
        }
        .icon img { width: 100%; height: 100%; object-fit: cover; }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0B1220;
            margin-top: 8px;
        }
        p {
            font-size: 14px;
            color: #64748B;
            max-width: 280px;
            line-height: 1.6;
        }
        button {
            margin-top: 8px;
            padding: 12px 28px;
            background: #FACC15;
            color: #2A1E04;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        button:active { opacity: .8; }
    </style>
</head>
<body>
    <div class="icon">
        <img src="/assets/branding/icon.png" alt="CarpoolHub">
    </div>
    <h1>You're offline</h1>
    <p>CarpoolHub needs an internet connection to load trips and notifications. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
</body>
</html>
